[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homebox-recall-checker"
version = "0.3.1"
description = "Check Homebox inventory against CPSC product recalls and notify via Apprise"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  # Upper-bounded, so a major is planned work: Apprise 2 changed its API, and FastAPI and
  # httpx are still 0.x, where 1.0 is the break to expect. APScheduler 4 is a rewrite.
  "httpx>=0.27,<1",
  "apprise>=1.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.4",
  "tzdata",  # slim images lack zoneinfo; needed for TZ / CHECK_CRON
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
recall-checker = "recall_checker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
