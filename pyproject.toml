[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homebox-recall-checker"
version = "0.2.0"
description = "Check Homebox inventory against CPSC product recalls and notify via Apprise"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "apprise>=1.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "pydantic-settings>=2.4",
  "tzdata",  # slim images lack zoneinfo; needed for TZ / CHECK_CRON
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
recall-checker = "recall_checker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
