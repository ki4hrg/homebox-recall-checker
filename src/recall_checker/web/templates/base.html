<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recall Checker{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><a href="/">Homebox Recall Checker</a></h1>
    {% block header_extra %}{% endblock %}
  </header>
  <main>
    {% if notice %}
      <div class="notice {{ 'ok' if notice[1] else 'err' }}" role="status">{{ notice[0] }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
