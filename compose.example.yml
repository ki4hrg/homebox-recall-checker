# Add this service to your existing Homebox stack (same compose project/network).
# The image is built and pushed by GitHub Actions; compose only pulls it.
services:
  recall-checker:
    # :latest moves only when a GitHub release is published, so Dockhand's
    # auto-update ("Check for updates" / scheduled updates) picks up each release.
    # Pin to e.g. :0.3 to only take patch releases. :main tracks every commit, amd64 only.
    image: ${RECALL_CHECKER_IMAGE:-ghcr.io/ki4hrg/homebox-recall-checker:latest}
    pull_policy: always            # tag is reused across builds; always pull the fresh one
    restart: unless-stopped
    depends_on:
      - homebox
    environment:
      HOMEBOX_URL: http://homebox:7745
      # Required: Homebox → Profile → API Keys (hb_…). Unset or empty stops `compose up`.
      HOMEBOX_TOKEN: ${HOMEBOX_RECALL_TOKEN:?set HOMEBOX_RECALL_TOKEN to a Homebox API key}
      HOMEBOX_PUBLIC_URL: https://homebox.example.com # for links in alerts
      PUBLIC_URL: https://recalls.example.com         # this UI: "Review match" links, allowed host
      # ALLOWED_HOSTS: recalls.example.com            # default: PUBLIC_URL's host, any IP, localhost
      APPRISE_URLS: ${RECALL_APPRISE_URLS:-}          # optional; e.g. ntfys://ntfy.example.com/recalls
      # CHECK_CRON: "0 7 * * *"                       # default: every 24h + on startup
      # MIN_NOTIFY_TIER: medium                       # low | medium | high
      # AUTO_WRITEBACK_TIER: high                     # tag + maintenance entry in Homebox
      # WRITEBACK: "true"
      # RECALL_SOURCES: cpsc,nhtsa                    # default
      # NHTSA_TYPES: C,E                              # C child seats, E equipment, T tires, V vehicles
      TZ: America/New_York
    # No healthcheck here: the image's own checks http://127.0.0.1:8080/api/health. If you
    # override it, use /api/health; /healthz is deprecated and goes away in a later release.
    volumes:
      - recall-checker-data:/data
    # The UI has no sign-in: anyone who reaches this port can confirm or dismiss matches.
    # Bound to 127.0.0.1 for a reverse proxy on the same host (put auth on the proxy).
    # Proxy on the same Docker network: drop `ports:`. Proxy on another machine, or plain LAN
    # access: bind the host's LAN address ("192.0.2.10:8080:8080") on a network you trust.
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  recall-checker-data:
