name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dockhand sync
        env:
          WEBHOOK_URL:   ${{ secrets.DOCKHAND_WEBHOOK_URL   || vars.DOCKHAND_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.DOCKHAND_WEBHOOK_TOKEN || vars.DOCKHAND_WEBHOOK_TOKEN }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOCKHAND_WEBHOOK_URL not set — skipping deploy notification."; exit 0
          fi
          url="$WEBHOOK_URL"
          if [ -n "$WEBHOOK_TOKEN" ]; then
            case "$url" in
              *\?*) url="$url&secret=$WEBHOOK_TOKEN" ;;
              *)    url="$url?secret=$WEBHOOK_TOKEN" ;;
            esac
          fi
          curl -fsS --retry 3 --retry-delay 5 "$url"
